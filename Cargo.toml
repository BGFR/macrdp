[package]
name = "macrdp"
version = "0.5.9"
edition = "2021"
description = "Native RDP server for macOS"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "macrdp"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }

# Logging / errors / config
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
bytes = "1"
rpassword = "7"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
zeroize = "1"
rubato = "0.16"  # 48 kHz SCK capture -> 44.1 kHz output, advertised to client

# TLS for RDP security layer
rustls = "0.23"
tokio-rustls = "0.26"
rcgen = "0.13"  # self-signed cert for first-run / dev
rustls-pemfile = "2"  # read persisted cert.pem / key.pem on subsequent runs
x509-cert = { version = "0.2", default-features = false }
der = "0.7"

# RDP protocol — ironrdp is split into many sub-crates; add only what you use.
ironrdp = "0.14"
ironrdp-server = "0.10"  # patched locally — see [patch.crates-io] below
ironrdp-acceptor = "0.8"
ironrdp-pdu = "0.7"
ironrdp-cliprdr = "0.5"
ironrdp-core = "0.1"
ironrdp-rdpsnd = "0.7"

# macOS-only: screen capture + input synthesis
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24", features = ["highsierra"] }
core-foundation = "0.10"
# ScreenCaptureKit bindings — verify the crate name/version against crates.io;
# alternatives: `screencapturekit`, or direct `objc2`/`objc2-screen-capture-kit`.
objc2 = "0.5"
objc2-foundation = "0.2"
objc2-app-kit = { version = "0.2", features = ["NSCursor", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "NSPasteboard"] }
screencapturekit = { version = "2.1", features = ["async"] }

# Vendored fork of ironrdp-server 0.10.0 with one fix: dispatch_server_events
# drops the OLDEST queued wave PDUs instead of the newest, so a dispatch stall
# no longer turns into a permanent audio-latency offset. See
# vendor/ironrdp-server/src/server.rs. Drop this patch once the fix is upstream.
[patch.crates-io]
ironrdp-server = { path = "vendor/ironrdp-server" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
