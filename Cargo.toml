[package]
name = "macrdp"
version = "0.5.53"
edition = "2021"
description = "Native RDP server for macOS"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "macrdp"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }

# Logging / errors / config
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
bytes = "1"
rpassword = "7"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
zeroize = "1"
rubato = "0.16"  # 48 kHz SCK capture -> 44.1 kHz output, advertised to client

# TLS for RDP security layer
rustls = "0.23"
tokio-rustls = "0.26"
rcgen = "0.13"  # self-signed cert for first-run / dev
rustls-pemfile = "2"  # read persisted cert.pem / key.pem on subsequent runs
x509-cert = { version = "0.2", default-features = false }
der = "0.7"

# RDP protocol — ironrdp is split into many sub-crates; add only what you use.
ironrdp = "0.14"
ironrdp-server = { version = "0.10", features = ["egfx"] }  # patched locally — see [patch.crates-io] below
ironrdp-acceptor = "0.8"
ironrdp-pdu = "0.7"
ironrdp-cliprdr = "0.5"
ironrdp-core = "0.1"
ironrdp-rdpsnd = "0.7"
# EGFX / H.264 video pipeline (gated at runtime by --enable-h264).
ironrdp-egfx = "0.1"
ironrdp-dvc = "0.5"
ironrdp-svc = "0.6"

# macOS-only: screen capture + input synthesis
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24", features = ["highsierra"] }
core-foundation = "0.10"
# ScreenCaptureKit bindings — verify the crate name/version against crates.io;
# alternatives: `screencapturekit`, or direct `objc2`/`objc2-screen-capture-kit`.
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSURL", "NSString", "NSError", "NSDictionary", "NSFileCoordinator", "NSFilePresenter", "NSOperation", "block2"] }
block2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSCursor", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "NSPasteboard", "NSPasteboardItem", "NSWorkspace", "NSRunningApplication", "libc"] }
screencapturekit = { version = "2.1", features = ["async"] }

# All ironrdp-* crates pinned to a specific upstream commit. The published
# 0.x crates lag main by enough that several features we need (file
# clipboard via SendFileContents{Request,Response}, the EGFX virtual channel
# for AVC/H.264, etc.) only exist on `master`. The pinned commit is bumped
# manually so the build is reproducible.
#
# `ironrdp-server` is the one exception — it stays vendored locally because
# our wave-drop fix isn't merged upstream yet (PR
# https://github.com/Devolutions/IronRDP/pull/1276). Our vendored 0.10.0
# compiles against the patched (master) sibling crates because upstream hasn't
# bumped the inter-crate version numbers since 0.10.0 was released. Once the
# wave-drop PR merges, drop the vendor block and add `ironrdp-server` to the
# git pin list below.
[patch.crates-io]
ironrdp-server = { path = "vendor/ironrdp-server" }
ironrdp                  = { git = "https://github.com/Devolutions/IronRDP.git", rev = "879ffed866c32748d30d26b54f9d667ad001c51c" }
ironrdp-acceptor         = { git = "https://github.com/Devolutions/IronRDP.git", rev = "879ffed866c32748d30d26b54f9d667ad001c51c" }
ironrdp-ainput           = { git = "https://github.com/Devolutions/IronRDP.git", rev = "879ffed866c32748d30d26b54f9d667ad001c51c" }
ironrdp-async            = { git = "https://github.com/Devolutions/IronRDP.git", rev = "879ffed866c32748d30d26b54f9d667ad001c51c" }
ironrdp-cliprdr          = { git = "https://github.com/Devolutions/IronRDP.git", rev = "879ffed866c32748d30d26b54f9d667ad001c51c" }
ironrdp-connector        = { git = "https://github.com/Devolutions/IronRDP.git", rev = "879ffed866c32748d30d26b54f9d667ad001c51c" }
ironrdp-core             = { git = "https://github.com/Devolutions/IronRDP.git", rev = "879ffed866c32748d30d26b54f9d667ad001c51c" }
ironrdp-displaycontrol   = { git = "https://github.com/Devolutions/IronRDP.git", rev = "879ffed866c32748d30d26b54f9d667ad001c51c" }
ironrdp-dvc              = { git = "https://github.com/Devolutions/IronRDP.git", rev = "879ffed866c32748d30d26b54f9d667ad001c51c" }
ironrdp-egfx             = { git = "https://github.com/Devolutions/IronRDP.git", rev = "879ffed866c32748d30d26b54f9d667ad001c51c" }
ironrdp-graphics         = { git = "https://github.com/Devolutions/IronRDP.git", rev = "879ffed866c32748d30d26b54f9d667ad001c51c" }
ironrdp-pdu              = { git = "https://github.com/Devolutions/IronRDP.git", rev = "879ffed866c32748d30d26b54f9d667ad001c51c" }
ironrdp-rdpsnd           = { git = "https://github.com/Devolutions/IronRDP.git", rev = "879ffed866c32748d30d26b54f9d667ad001c51c" }
ironrdp-svc              = { git = "https://github.com/Devolutions/IronRDP.git", rev = "879ffed866c32748d30d26b54f9d667ad001c51c" }
ironrdp-tokio            = { git = "https://github.com/Devolutions/IronRDP.git", rev = "879ffed866c32748d30d26b54f9d667ad001c51c" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
