[package]
name = "ironrdp-cliprdr"
version = "0.5.0"
readme = "README.md"
description = "CLIPRDR static channel for clipboard implemented as described in MS-RDPECLIP"
publish = false
# Vendored copy of upstream ironrdp-cliprdr (Devolutions/IronRDP@0282d18) for ONE
# divergence: add `on_format_list_response(&mut self, ok: bool)` to the
# CliprdrBackend trait and call it from handle_format_list_response. Without
# this hook there is no way for a backend (e.g. macrdp's server-side file
# clipboard) to learn whether its FormatList was accepted or rejected by the
# remote, which is needed to retry on Fail without clobbering an Ok with a
# subsequent re-advertise. Default empty impl keeps it non-breaking. Submitted
# upstream; drop this vendor dir once it lands in a released ironrdp-cliprdr.
# Workspace-inherited fields are inlined because we're not inside the IronRDP
# cargo workspace; sibling deps are version-only and resolve via the root
# macrdp Cargo.toml's [patch.crates-io] git pins.
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Devolutions/IronRDP"
repository = "https://github.com/Devolutions/IronRDP"
authors = ["Devolutions Inc. <infos@devolutions.net>"]
keywords = ["rdp", "remote-desktop", "network", "protocol"]
categories = ["network-programming"]

[lib]
doctest = false
test = false

[features]
# Internal (PRIVATE!) features used to aid testing.
# Don't rely on these whatsoever. They may disappear at any time.
__test = ["dep:visibility"]

[dependencies]
ironrdp-core = { version = "0.1" } # public
ironrdp-pdu = { version = "0.7" } # public
ironrdp-svc = { version = "0.6" } # public
tracing = { version = "0.1", features = ["log"] }
bitflags = "2.11"
visibility = { version = "0.1", optional = true }
